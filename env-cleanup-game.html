<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Environment Cleanup Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin:0; padding:0; background: #ecf9f8; font-family: Arial, sans-serif; text-align:center;}
    #gameArea { position: relative; width: 97vw; max-width: 700px; aspect-ratio: 4/3; height: 70vw; max-height: 525px; margin: 16px auto; background: #aeeeac; border: 2px solid #444; border-radius: 20px; overflow: hidden;}
    .bin-label { font-size: 1.2em; color: #222; }
    #scoreboard { font-size:1.1em; margin: 8px 0;}
    #dpad { position:absolute; left:10px; bottom:15px; width:120px; height: 120px; z-index:10; }
    .dpad-btn {
      position:absolute; background: #fff2cc; border-radius:12px; opacity:0.8; border:2px solid #c9c3b3;
      width:40px; height:40px; font-size: 2em; display:flex; justify-content:center; align-items:center; user-select:none;
    }
    #up {left:40px;top:0;}
    #down {left:40px;top:80px;}
    #left {left:0;top:40px;}
    #right {left:80px;top:40px;}
    #pickdropBtn {
      position:absolute; right:15px; bottom:25px; width:90px; height:90px; font-size:1.0em;
      background: #b7e2f8; border-radius:45px; border:2px solid #59a2d8; display:flex; align-items:center; justify-content:center; z-index:10;
    }
    @media (max-width: 500px) {
      #gameArea { width:98vw; max-width:100vw; height:74vw; max-height:72vw; }
      #dpad {width:90px;height:90px;}
      .dpad-btn {width:30px; height:30px;font-size:1.3em; border-radius:9px;}
      #pickdropBtn {width:55px; height:55px; font-size:0.85em; border-radius:27px;}
    }
  </style>
</head>
<body>
  <h2>Environment Cleanup Game ♻️</h2>
  <div id="scoreboard">
    Score: <span id="score">0</span> &nbsp;|&nbsp; High Score: <span id="highScore">0</span>
  </div>
  <div id="gameArea">
    <div id="dpad">
      <div class="dpad-btn" id="up">&#9650;</div>
      <div class="dpad-btn" id="down">&#9660;</div>
      <div class="dpad-btn" id="left">&#9664;</div>
      <div class="dpad-btn" id="right">&#9654;</div>
    </div>
    <button id="pickdropBtn">Pick/Drop</button>
    <canvas id="gameCanvas" width="700" height="525" style="width:100%; height:100%"></canvas>
  </div>
  <div style="margin-top:10px; font-size:1em; color:#444;">Move with arrows. Tap "Pick/Drop" to grab or place trash.<br>Sort trash into the correct bin!</div>
  <script>
const CANVAS_WIDTH = 700, CANVAS_HEIGHT = 525;
const PLAYER_SIZE = 32, TRASH_SIZE = 26, BIN_SIZE = 60;
const SPEED = 6;
const TRASH_TYPES = ["Organik", "Nonorganik", "B3"];
const TYPE_COLORS = { "Organik":"#4ead2f", "Nonorganik":"#565660", "B3":"#e3b111"};
const BINS = [
  {type: "Organik", x: 60, y: 80 },
  {type: "Nonorganik", x: 570, y: 80 },
  {type: "B3", x: 320, y: 430 }
];
const BIN_EMOJIS = {"Organik":"🍃", "Nonorganik":"🧃", "B3":"☠️"};
const TRASH_EMOJIS = {"Organik":"🍂","Nonorganik":"🧃","B3":"💉"};

let canvas = document.getElementById('gameCanvas');
let ctx = canvas.getContext('2d');

function randInt(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }

function genTrash() {
  let margin = 70;
  let t = TRASH_TYPES[randInt(0,2)];
  let tries=0, tx,ty,ok=false;
  while (!ok && tries<20) {
    tx = randInt(margin, CANVAS_WIDTH-margin-TRASH_SIZE);
    ty = randInt(margin+30, CANVAS_HEIGHT-margin-TRASH_SIZE);
    // don't spawn near bins
    ok = true;
    for (const bin of BINS) {
      let dx=tx-bin.x, dy=ty-bin.y;
      if (dx*dx+dy*dy<9000) ok=false;
    }
    tries++;
  }
  return {type:t, x:tx, y:ty, held:false};
}

let state = {
  player: {x:CANVAS_WIDTH/2-PLAYER_SIZE/2, y:CANVAS_HEIGHT/2-PLAYER_SIZE/2, held:null},
  trashes: [genTrash(), genTrash(), genTrash()],
  score: 0,
  highScore: 0,
  message: "",
};

function getHighScore(){
  return Number(localStorage.getItem("envcleanup_highscore")||0);
}
function setHighScore(v){
  localStorage.setItem("envcleanup_highscore", String(v));
  state.highScore = v;
  document.getElementById("highScore").textContent = v;
}
function showScore() {
  document.getElementById("score").textContent = state.score;
  if (state.score > state.highScore) setHighScore(state.score);
}
window.onload = function() {
  state.highScore = getHighScore();
  document.getElementById("highScore").textContent = state.highScore;
  requestAnimationFrame(gameLoop);
};

function drawBin(bin) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(bin.x+BIN_SIZE/2, bin.y+BIN_SIZE/2, BIN_SIZE/2, 0, Math.PI*2);
  ctx.fillStyle = TYPE_COLORS[bin.type];
  ctx.fill();
  ctx.font = "34px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff";
  ctx.fillText(BIN_EMOJIS[bin.type],bin.x+BIN_SIZE/2,bin.y+BIN_SIZE/2-8);
  ctx.font = "16px Arial";
  ctx.fillText(bin.type, bin.x+BIN_SIZE/2, bin.y+BIN_SIZE-6);
  ctx.restore();
}

function drawTrash(trash) {
  if (trash.held) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(trash.x+TRASH_SIZE/2, trash.y+TRASH_SIZE/2, TRASH_SIZE/2, 0, Math.PI*2);
  ctx.fillStyle = TYPE_COLORS[trash.type];
  ctx.fill();
  ctx.font = "22px Arial";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; 
  ctx.fillText(TRASH_EMOJIS[trash.type], trash.x+TRASH_SIZE/2, trash.y+TRASH_SIZE/2);
  ctx.restore();
}

function drawPlayer() {
  let p = state.player;
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x+PLAYER_SIZE/2, p.y+PLAYER_SIZE/2, PLAYER_SIZE/2, 0, 2*Math.PI);
  ctx.fillStyle = "#4686f1";
  ctx.fill();
  ctx.strokeStyle="#225";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.font="25px Arial";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff";
  ctx.fillText("🙂", p.x+PLAYER_SIZE/2, p.y+PLAYER_SIZE/2-2);
  // Carrying trash
  if (p.held) {
    ctx.font="18px Arial";
    ctx.fillText(TRASH_EMOJIS[p.held.type], p.x+PLAYER_SIZE/2, p.y+6);
  }
  ctx.restore();
}

function dist(a,b) {
  let dx = a.x+PLAYER_SIZE/2 - (b.x+b.w/2);
  let dy = a.y+PLAYER_SIZE/2 - (b.y+b.h/2);
  return Math.sqrt(dx*dx+dy*dy);
}

function gameLoop() {
  // Logic
  // Clear
  ctx.clearRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);

  // Draw bins
  for (const bin of BINS) {
    drawBin(bin);
  }

  // Draw trashe
  for (const t of state.trashes) {
    drawTrash(t);
  }

  // Draw player
  drawPlayer();

  // Draw message
  if (state.message) {
    ctx.font = "26px Arial";
    ctx.textAlign="center";
    ctx.fillStyle="#9f6b00";
    ctx.fillText(state.message, CANVAS_WIDTH/2, 31);
  }

  requestAnimationFrame(gameLoop);
}

//--- Input controls ---//
let keydirs = {};

function tryPickDrop() {
  let p = state.player;
  if (!p.held) {
    // Try picking up if player near a trash
    for (let t of state.trashes) {
      let r1 = {x:p.x, y:p.y, w:PLAYER_SIZE, h:PLAYER_SIZE};
      let r2 = {x:t.x, y:t.y, w:TRASH_SIZE, h:TRASH_SIZE};
      if (!t.held && rectsOverlap(r1,r2)) {
        p.held = t;
        t.held = true;
        state.message = `Got ${t.type} trash!`;
        setTimeout(()=>{state.message="";},800);
        return;
      }
    }
    state.message = "No trash here!";
    setTimeout(()=>{state.message="";},700);
  } else {
    // Try dropping to bin
    let dropOk = false;
    for (const bin of BINS) {
      let r1 = {x:p.x, y:p.y, w:PLAYER_SIZE, h:PLAYER_SIZE};
      let r2 = {x:bin.x, y:bin.y, w:BIN_SIZE, h:BIN_SIZE};
      if (rectsOverlap(r1,r2)){
        if (bin.type === p.held.type) {
          // Success
          state.score += 10;
          state.trashes.splice(state.trashes.indexOf(p.held),1);
          state.trashes.push(genTrash());
          state.message = "Correct! +10";
          setTimeout(()=>{state.message="";},900);
        } else {
          state.score = Math.max(0,state.score-5);
          state.message = "Wrong bin! -5";
          setTimeout(()=>{state.message="";},1000);
        }
        p.held = null;
        showScore();
        dropOk = true;
        break;
      }
    }
    if (!dropOk) {
      state.message="Go to bin!";
      setTimeout(()=>{state.message="";},800);
    }
  }
}

// Rectangle collision (simple AABB)
function rectsOverlap(a,b){
  return !(a.x+a.w<b.x || a.x>b.x+b.w || a.y+a.h<b.y || a.y>b.y+b.h);
}

// Touch D-Pad
function moveDir(dx,dy) {
  let p = state.player;
  p.x += dx*SPEED;
  p.y += dy*SPEED;
  p.x = Math.max(0, Math.min(CANVAS_WIDTH-PLAYER_SIZE,p.x));
  p.y = Math.max(0, Math.min(CANVAS_HEIGHT-PLAYER_SIZE,p.y));
}

// Dpad touch
function dpadpress(dir){
  switch(dir){
    case 'up': moveDir(0,-1); break;
    case 'down': moveDir(0,1); break;
    case 'left': moveDir(-1,0); break;
    case 'right': moveDir(1,0); break;
  }
}
// Continuous movement for touch
let moveInterval={};
for (let dir of ['up','down','left','right']){
  let elem = document.getElementById(dir);
  elem.addEventListener('touchstart', function(e){
    e.preventDefault();
    dpadpress(dir);
    moveInterval[dir]=setInterval(()=>dpadpress(dir),120);
  });
  elem.addEventListener('touchend', function(e){
    clearInterval(moveInterval[dir]);
  });
  elem.addEventListener('mousedown', function(e){
    dpadpress(dir);
    moveInterval[dir]=setInterval(()=>dpadpress(dir),120);
  });
  elem.addEventListener('mouseup', function(e){
    clearInterval(moveInterval[dir]);
  });
  elem.addEventListener('mouseleave', function(e){
    clearInterval(moveInterval[dir]);
  });
}

// Pick/drop button
document.getElementById("pickdropBtn").addEventListener('touchstart', function(e){
  e.preventDefault(); tryPickDrop();
});
document.getElementById("pickdropBtn").addEventListener('mousedown', function(e){
  tryPickDrop();
});

// Keyboard fallback
window.addEventListener('keydown', function(e){
  if (e.repeat) return;
  switch(e.key){
    case "ArrowUp": keydirs.up=true; moveDir(0,-1); break;
    case "ArrowDown": keydirs.down=true; moveDir(0,1); break;
    case "ArrowLeft": keydirs.left=true; moveDir(-1,0); break;
    case "ArrowRight": keydirs.right=true; moveDir(1,0); break;
    case " ":
    case "Enter": tryPickDrop(); break;
  }
});
window.addEventListener('keyup', function(e){
  switch (e.key){
    case"ArrowUp": keydirs.up=false; break; case"ArrowDown": keydirs.down=false; break;
    case"ArrowLeft": keydirs.left=false; break; case"ArrowRight": keydirs.right=false; break;
  }
});

// Keyboard movement (hold)
setInterval(function(){
  if(keydirs.up) moveDir(0,-1);
  if(keydirs.down) moveDir(0,1);
  if(keydirs.left) moveDir(-1,0);
  if(keydirs.right) moveDir(1,0);
},90);

showScore();
  </script>
</body>
</html>
